name = "cf-vps-monitor"
main = "worker/src/index.ts"
compatibility_date = "2026-06-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[placement]
mode = "smart"

[triggers]
crons = ["*/2 * * * *"]

# 公开元数据读接口的限流不需要全局强一致：用 Rate Limiting 绑定按数据中心近似
# 计数，省掉每次请求一次 RATE_LIMIT DO 往返（约 200ms）。历史/实时等接口仍走 DO。
[[ratelimits]]
name = "PUBLIC_METADATA_RATE_LIMITER"
namespace_id = "4039121"

  [ratelimits.simple]
  limit = 120
  period = 60

[[durable_objects.bindings]]
name = "LIVE_DATA"
class_name = "LiveDataDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveDataDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimitDO"]

[vars]
SUPABASE_URL = "https://PROJECT_REF.supabase.co"

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 第三方主题的静态文件名由上游决定（`/assets/...`、`/style.css`、`/fonts/...` 都可能），
# 枚举不过来，所以除了内置资源目录之外全部先交给 worker：
# 主题启用时按上游取文件 / 回主题 index，未启用时原样透传给静态资源层。
run_worker_first = ["/*", "!/assets/*"]
